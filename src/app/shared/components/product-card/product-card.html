<div class="product-card">
    <div class="image-wrapper">
        <img [src]="product.image" [alt]="product.name" class="product-image">
        <div class="badge" *ngIf="product.badge">{{ product.badge }}</div>
        <div class="action-overlay">
            <button class="view-btn">View Details</button>
        </div>
    </div>

    <div class="content">
        <div class="header">
            <h3 class="name">{{ product.name }}</h3>
            <div class="price">{{ product.price | currency:'INR' }}</div>
        </div>

        <p class="description">{{ product.description }}</p>

        <div class="footer">
            <button (click)="onOrder()" class="order-btn">
                <svg class="icon" fill="currentColor" viewBox="0 0 24 24">

                        d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.588-5.946 0-6.556 5.332-11.891 11.887-11.891 3.181 0 6.167 1.24 8.407 3.481 2.242 2.241 3.481 5.226 3.481 8.41 0 6.556-5.331 11.89-11.888 11.89-2.015 0-3.991-.511-5.741-1.486l-6.245 1.705zm6.814-4.836c1.551.921 3.255 1.408 5.011 1.408 5.398 0 9.791-4.393 9.791-9.791 0-2.612-1.017-5.068-2.862-6.913-1.846-1.846-4.302-2.862-6.914-2.862-5.398 0-9.791-4.393-9.791 9.791 0 1.842.518 3.636 1.5 5.187l-.986 3.593 3.687-.968zm11.415-7.319c-.314-.157-1.859-.918-2.146-1.023-.287-.105-.497-.157-.706.157-.209.314-.811 1.023-1.002 1.25-.19.227-.37.251-.684.094-.314-.157-1.325-.489-2.525-1.559-.933-.833-1.562-1.862-1.745-2.176-.182-.314-.019-.484.137-.64.141-.141.314-.366.471-.55.157-.183.209-.314.314-.523.105-.209.052-.393-.026-.55-.079-.157-.706-1.701-.968-2.33-.255-.612-.516-.529-.706-.539-.182-.008-.392-.01-.601-.01-.209 0-.55.079-.838.393-.287.314-1.1 1.074-1.1 2.617 0 1.542 1.125 3.033 1.282 3.243.157.209 2.214 3.38 5.363 4.741.749.324 1.334.518 1.791.663.754.23 1.442.197 1.984.116.604-.09 1.859-.759 2.121-1.492.261-.733.261-1.361.183-1.492-.079-.131-.287-.209-.601-.366z" />
