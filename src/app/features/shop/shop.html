<div class="shop-page dot-pattern">
    <div class="shop-container">
        <header class="shop-header">
            <h1 class="title">Our <span>Collection</span></h1>
            <p class="subtitle">Browse our range of handcrafted crochet items and premium craft supplies.</p>

            <div class="filter-bar">
                <button class="filter-btn active">All Items</button>
                <button class="filter-btn">Finished Goods</button>
                <button class="filter-btn">Patterns</button>
                <button class="filter-btn">Supplies</button>
            </div>
        </header>

        <div class="products-grid">
            @for (product of products; track product.id) {
            <app-product-card [product]="product" (order)="orderOnWhatsApp($event)">
            </app-product-card>
            }
        </div>
    </div>
</div>
